<html lang="zh-CN" data-theme="light">

<title>DevPortal · 教程门户重设计稿 v2.0</title>
<style>
/* ═══════════════════════════════════════════════════
   DevPortal 2.0 Design Tokens
   ═══════════════════════════════════════════════════ */
:root{
  --gray-50:#fafafa;--gray-100:#f4f4f5;--gray-200:#e4e4e7;--gray-300:#d4d4d8;
  --gray-400:#a1a1aa;--gray-500:#71717a;--gray-600:#52525b;--gray-700:#3f3f46;
  --gray-800:#27272a;--gray-900:#18181b;--gray-950:#09090b;
  --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;--blue-300:#93c5fd;
  --blue-400:#60a5fa;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-700:#1d4ed8;
  --purple-50:#faf5ff;--purple-100:#f3e8ff;--purple-400:#c084fc;--purple-500:#a855f7;--purple-600:#9333ea;--purple-700:#7c3aed;
  --green-500:#10b981;--green-600:#059669;
  --amber-500:#f59e0b;--amber-600:#d97706;
  --red-500:#ef4444;--red-600:#dc2626;
  --teal-500:#14b8a6;--cyan-500:#06b6d4;--indigo-500:#6366f1;--rose-500:#f43f5e;--orange-500:#f97316;

  --bg:var(--gray-50);--bg-subtle:var(--gray-100);--surface:#ffffff;--surface-hover:var(--gray-50);
  --border:var(--gray-200);--border-subtle:var(--gray-100);
  --text:var(--gray-900);--text-2:var(--gray-600);--text-3:var(--gray-400);
  --primary:var(--blue-600);--primary-hover:var(--blue-700);--primary-light:var(--blue-50);
  --accent:var(--purple-600);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.12);

  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Code','Fira Code','Consolas',monospace;
  --fs-xs:12px;--fs-sm:13px;--fs-base:14px;--fs-md:15px;--fs-lg:17px;--fs-xl:20px;--fs-2xl:24px;--fs-3xl:30px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --radius-sm:6px;--radius:8px;--radius-md:10px;--radius-lg:14px;--radius-full:9999px;
  --topbar-h:56px;--sidebar-w:240px;--content-max:1280px;
  --transition:.18s cubic-bezier(.4,0,.2,1);--transition-slow:.3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:var(--gray-950);--bg-subtle:var(--gray-900);--surface:var(--gray-900);--surface-hover:var(--gray-800);
  --border:var(--gray-800);--border-subtle:var(--gray-800);
  --text:var(--gray-50);--text-2:var(--gray-400);--text-3:var(--gray-500);
  --primary:var(--blue-400);--primary-hover:var(--blue-300);--primary-light:rgba(59,130,246,.12);
  --accent:var(--purple-400);
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.6;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition)}
::selection{background:var(--blue-200);color:var(--blue-900)}
[data-theme="dark"] ::selection{background:rgba(59,130,246,.3);color:var(--blue-100)}
a{text-decoration:none;color:inherit}

/* ═════ Scrollbar ═════ */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:var(--gray-700)}

/* ═════ TOPBAR ═════ */
.topbar{
  position:sticky;top:0;z-index:100;height:var(--topbar-h);
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 var(--sp-6);gap:var(--sp-4);
  backdrop-filter:saturate(180%) blur(8px);
}
.topbar .logo{display:flex;align-items:center;gap:var(--sp-2);font-weight:700;font-size:var(--fs-md);color:var(--text);white-space:nowrap;cursor:pointer}
.topbar .logo-badge{
  width:28px;height:28px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--blue-600),var(--purple-600));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:13px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(37,99,235,.3);
}
.topbar .logo span{color:var(--text-3);font-weight:400;font-size:var(--fs-sm)}
.topbar .search-trigger{
  flex:1;max-width:420px;display:flex;align-items:center;gap:var(--sp-2);
  background:var(--bg-subtle);border:1px solid var(--border);
  border-radius:var(--radius);padding:7px var(--sp-3);
  color:var(--text-3);font-size:var(--fs-sm);cursor:pointer;
  transition:all var(--transition);
}
.topbar .search-trigger:hover{border-color:var(--primary);background:var(--surface);box-shadow:var(--shadow-sm)}
.topbar .search-trigger svg{width:16px;height:16px;flex-shrink:0}
.topbar .search-trigger .kbd{
  margin-left:auto;font-family:var(--font-mono);font-size:11px;
  padding:2px 6px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);color:var(--text-3);
}
.topbar .spacer{flex:1}
.topbar .icon-btn{
  width:34px;height:34px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-2);transition:all var(--transition);flex-shrink:0;
}
.topbar .icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--surface-hover)}
.topbar .icon-btn svg{width:16px;height:16px}
.topbar .hamburger{display:none}

/* ═════ LAYOUT ═════ */
.layout{display:flex;min-height:calc(100vh - var(--topbar-h))}

/* ═════ SIDEBAR ═════ */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  border-right:1px solid var(--border);
  padding:var(--sp-4) var(--sp-3);
  position:sticky;top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h));overflow-y:auto;overflow-x:hidden;
}
.sidebar .cat-label{
  font-size:11px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.08em;
  padding:var(--sp-4) var(--sp-3) var(--sp-1);
  display:flex;align-items:center;gap:6px;
}
.sidebar .cat-label:first-child{padding-top:var(--sp-1)}
.sidebar .nav-item{
  display:flex;align-items:center;gap:var(--sp-2);
  padding:6px var(--sp-3);border-radius:var(--radius-sm);
  font-size:var(--fs-sm);color:var(--text-2);
  cursor:pointer;transition:all var(--transition);
  border-left:2px solid transparent;margin:1px 0;line-height:1.4;
}
.sidebar .nav-item:hover{background:var(--bg-subtle);color:var(--text)}
.sidebar .nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600;border-left-color:var(--primary)}
.sidebar .cat-label.cat-active{color:var(--primary)}
.sidebar .nav-item .ic{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.7}
.sidebar .nav-item.active .ic{opacity:1}
.sidebar .nav-item .ic svg{width:16px;height:16px}
.sidebar .nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar .nav-item .badge-new{
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:var(--radius-full);
  background:var(--green-500);color:#fff;letter-spacing:.03em;
}

/* ═════ MAIN ═════ */
.main{flex:1;overflow-x:hidden;min-width:0}
.content-wrap{max-width:var(--content-max);margin:0 auto;padding:var(--sp-8) var(--sp-8) var(--sp-16)}

/* ═════ HERO ═════ */
.hero{margin-bottom:var(--sp-10)}
.hero .hero-eyebrow{
  font-family:var(--font-mono);font-size:12px;color:var(--primary);
  font-weight:600;letter-spacing:.03em;margin-bottom:var(--sp-2);
  display:flex;align-items:center;gap:6px;
}
.hero .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green-500);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:var(--fs-3xl);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-bottom:var(--sp-3)}
.hero h1 .grad{
  background:linear-gradient(135deg,var(--blue-600),var(--purple-600));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
[data-theme="dark"] .hero h1 .grad{background:linear-gradient(135deg,var(--blue-400),var(--purple-400));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .hero-desc{color:var(--text-2);font-size:var(--fs-md);line-height:1.7;max-width:620px}
.hero .hero-stats{display:flex;gap:var(--sp-6);margin-top:var(--sp-5)}
.hero .stat{display:flex;align-items:baseline;gap:6px}
.hero .stat .num{font-size:var(--fs-xl);font-weight:700;font-family:var(--font-mono);color:var(--text)}
.hero .stat .lbl{font-size:var(--fs-sm);color:var(--text-3)}
.hero .stat .sep{color:var(--gray-300);margin:0 var(--sp-1)}

/* ═════ SECTION ═════ */
.cat-section{margin-bottom:var(--sp-10);scroll-margin-top:calc(var(--topbar-h) + var(--sp-4))}
.cat-header{
  display:flex;align-items:center;gap:var(--sp-3);
  margin-bottom:var(--sp-4);padding-bottom:var(--sp-3);
  border-bottom:1px solid var(--border);
}
.cat-header .cat-icon-box{
  width:32px;height:32px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cat-header .cat-icon-box svg{width:18px;height:18px}
.cat-header .cat-title{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em}
.cat-header .cat-count{
  font-size:var(--fs-xs);color:var(--text-3);font-family:var(--font-mono);
  padding:2px 8px;background:var(--bg-subtle);border-radius:var(--radius-full);
}
.cat-header .cat-link{
  margin-left:auto;font-size:var(--fs-sm);color:var(--primary);
  display:flex;align-items:center;gap:4px;transition:opacity var(--transition);
  cursor:pointer;
}
.cat-header .cat-link:hover{opacity:.7}

/* ═════ CARD GRID ═════ */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-4)}
.tut-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:var(--sp-4);
  display:flex;flex-direction:column;gap:var(--sp-2);
  cursor:pointer;transition:all var(--transition);
  position:relative;overflow:hidden;
}
.tut-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--card-accent,var(--blue-500));
  opacity:0;transition:opacity var(--transition);
}
.tut-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.tut-card:hover::before{opacity:1}
.tut-card .card-top{display:flex;align-items:flex-start;gap:var(--sp-3)}
.tut-card .card-icon{
  width:36px;height:36px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.tut-card .card-icon svg{width:18px;height:18px}
.tut-card h4{font-size:var(--fs-sm);font-weight:600;line-height:1.4;flex:1}
.tut-card .card-desc{font-size:var(--fs-xs);color:var(--text-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tut-card .card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:var(--sp-1)}
.tut-card .card-meta{
  display:flex;align-items:center;gap:var(--sp-3);
  margin-top:auto;padding-top:var(--sp-2);
  border-top:1px solid var(--border-subtle);
  font-size:11px;color:var(--text-3);font-family:var(--font-mono);
}
.tut-card .card-meta span{display:flex;align-items:center;gap:3px}
.tut-card .card-meta svg{width:12px;height:12px;opacity:.6}

/* Tag colors */
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--radius-full);line-height:1.6;white-space:nowrap}
.t-blue{background:var(--blue-50);color:var(--blue-700)}
.t-purple{background:var(--purple-50);color:var(--purple-700)}
.t-green{background:#ecfdf5;color:var(--green-600)}
.t-amber{background:#fffbeb;color:var(--amber-600)}
.t-red{background:#fef2f2;color:var(--red-600)}
.t-gray{background:var(--gray-100);color:var(--gray-600)}
.t-teal{background:#f0fdfa;color:var(--teal-500)}
.t-indigo{background:#eef2ff;color:var(--indigo-500)}
.t-cyan{background:#ecfeff;color:var(--cyan-500)}
.t-rose{background:#fff1f2;color:var(--rose-500)}
.t-orange{background:#fff7ed;color:var(--orange-500)}
[data-theme="dark"] .t-blue{background:rgba(59,130,246,.15);color:var(--blue-300)}
[data-theme="dark"] .t-purple{background:rgba(168,85,247,.15);color:var(--purple-400)}
[data-theme="dark"] .t-green{background:rgba(16,185,129,.15);color:var(--green-500)}
[data-theme="dark"] .t-amber{background:rgba(245,158,11,.15);color:var(--amber-500)}
[data-theme="dark"] .t-red{background:rgba(239,68,68,.15);color:var(--red-500)}
[data-theme="dark"] .t-gray{background:var(--gray-800);color:var(--gray-400)}
[data-theme="dark"] .t-teal{background:rgba(20,184,166,.15);color:var(--teal-500)}
[data-theme="dark"] .t-indigo{background:rgba(99,102,241,.15);color:var(--indigo-500)}
[data-theme="dark"] .t-cyan{background:rgba(6,182,212,.15);color:var(--cyan-500)}
[data-theme="dark"] .t-rose{background:rgba(244,63,94,.15);color:var(--rose-500)}
[data-theme="dark"] .t-orange{background:rgba(249,115,22,.15);color:var(--orange-500)}

/* Icon backgrounds */
.ic-bg-blue{background:var(--blue-50);color:var(--blue-600)}
.ic-bg-purple{background:var(--purple-50);color:var(--purple-600)}
.ic-bg-green{background:#ecfdf5;color:var(--green-600)}
.ic-bg-amber{background:#fffbeb;color:var(--amber-600)}
.ic-bg-red{background:#fef2f2;color:var(--red-600)}
.ic-bg-teal{background:#f0fdfa;color:var(--teal-500)}
.ic-bg-indigo{background:#eef2ff;color:var(--indigo-500)}
.ic-bg-cyan{background:#ecfeff;color:var(--cyan-500)}
.ic-bg-orange{background:#fff7ed;color:var(--orange-500)}
.ic-bg-gray{background:var(--gray-100);color:var(--gray-600)}
[data-theme="dark"] .ic-bg-blue{background:rgba(59,130,246,.12);color:var(--blue-400)}
[data-theme="dark"] .ic-bg-purple{background:rgba(168,85,247,.12);color:var(--purple-400)}
[data-theme="dark"] .ic-bg-green{background:rgba(16,185,129,.12);color:var(--green-500)}
[data-theme="dark"] .ic-bg-amber{background:rgba(245,158,11,.12);color:var(--amber-500)}
[data-theme="dark"] .ic-bg-red{background:rgba(239,68,68,.12);color:var(--red-500)}
[data-theme="dark"] .ic-bg-teal{background:rgba(20,184,166,.12);color:var(--teal-500)}
[data-theme="dark"] .ic-bg-indigo{background:rgba(99,102,241,.12);color:var(--indigo-500)}
[data-theme="dark"] .ic-bg-cyan{background:rgba(6,182,212,.12);color:var(--cyan-500)}
[data-theme="dark"] .ic-bg-orange{background:rgba(249,115,22,.12);color:var(--orange-500)}
[data-theme="dark"] .ic-bg-gray{background:var(--gray-800);color:var(--gray-400)}

/* ═════ COMMAND PALETTE ═════ */
.cmd-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;
  padding-top:15vh;
}
.cmd-overlay.show{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cmd-panel{
  width:90%;max-width:560px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.cmd-input-wrap{
  display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--border);
}
.cmd-input-wrap svg{width:18px;height:18px;color:var(--text-3);flex-shrink:0}
.cmd-input{
  flex:1;border:none;outline:none;background:none;
  font-size:var(--fs-md);color:var(--text);font-family:var(--font-sans);
}
.cmd-input::placeholder{color:var(--text-3)}
.cmd-esc{
  font-family:var(--font-mono);font-size:11px;
  padding:2px 6px;border-radius:var(--radius-sm);
  border:1px solid var(--border);color:var(--text-3);
}
.cmd-results{max-height:400px;overflow-y:auto;padding:var(--sp-2)}
.cmd-group-label{
  font-size:11px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.08em;
  padding:var(--sp-2) var(--sp-3) var(--sp-1);
}
.cmd-item{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);border-radius:var(--radius);
  cursor:pointer;transition:background var(--transition);
}
.cmd-item.selected{background:var(--primary-light)}
.cmd-item .ci-icon{
  width:28px;height:28px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cmd-item .ci-icon svg{width:14px;height:14px}
.cmd-item .ci-info{flex:1;min-width:0}
.cmd-item .ci-title{font-size:var(--fs-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-item .ci-cat{font-size:11px;color:var(--text-3);font-family:var(--font-mono)}
.cmd-item .ci-enter{font-size:11px;color:var(--text-3);opacity:0;transition:opacity var(--transition)}
.cmd-item.selected .ci-enter{opacity:1}
.cmd-empty{padding:var(--sp-8);text-align:center;color:var(--text-3);font-size:var(--fs-sm)}
.cmd-footer{
  display:flex;align-items:center;gap:var(--sp-4);
  padding:var(--sp-2) var(--sp-4);border-top:1px solid var(--border);
  font-size:11px;color:var(--text-3);background:var(--bg-subtle);
}
.cmd-footer span{display:flex;align-items:center;gap:4px}
.cmd-footer kbd{
  font-family:var(--font-mono);font-size:10px;
  padding:1px 5px;border-radius:4px;
  background:var(--surface);border:1px solid var(--border);
}

/* ═════ MOBILE OVERLAY ═════ */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
.overlay.show{display:block}

/* ═════ RESPONSIVE ═════ */
@media(max-width:1024px){
  .content-wrap{padding:var(--sp-6) var(--sp-5) var(--sp-12)}
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
}
@media(max-width:768px){
  .topbar{padding:0 var(--sp-3);gap:var(--sp-2)}
  .topbar .logo span{display:none}
  .topbar .search-trigger{max-width:none}
  .topbar .search-trigger .kbd{display:none}
  .topbar .hamburger{display:flex;width:34px;height:34px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;cursor:pointer;color:var(--text-2)}
  .topbar .hamburger svg{width:18px;height:18px}
  .sidebar{
    position:fixed;top:var(--topbar-h);left:0;bottom:0;z-index:95;

/* ═══════════════════════════════════════════════════
   Render Sidebar
   ═══════════════════════════════════════════════════ */
function renderSidebar(){
  const el = document.getElementById('sidebar');
  let html = '<div class="cat-label">全部教程</div>';
  html += `<a class="nav-item active" id="nav-home" onclick="scrollToTop()" style="cursor:pointer">
    <span class="ic">${I.grid}</span><span class="nm">首页总览</span>
  </a>`;
  for(const cat of categories){
    html += `<div class="cat-label" id="cat-label-${cat.id}" data-cat="${cat.id}">${escapeHtml(cat.label)}</div>`;
    for(const t of cat.tutorials){
      html += `<a class="nav-item" style="cursor:pointer" data-cat="${cat.id}" data-title="${escapeHtml(t.t)}" onclick="scrollToSection('${cat.id}')">
        <span class="ic">${I[t.icon] || I.book}</span>
        <span class="nm">${escapeHtml(t.t.length > 22 ? t.t.slice(0,20)+'…' : t.t)}</span>
        ${t.isNew ? '<span class="badge-new">NEW</span>' : ''}
      </a>`;
    }
  }
  el.innerHTML = html;
}

/* ═══════════════════════════════════════════════════

   ═══════════════════════════════════════════════════ */

  const el = document.getElementById('content');
  let totalTuts = categories.reduce((s,c)=>s+c.tutorials.length,0);
  let totalCats = categories.length;

  let html = `
    <!-- HERO -->
    <section class="hero">
      <div class="hero-eyebrow"><span class="dot"></span> 持续更新 · 最近更新于 2026.07.13</div>
      <h1>交互式技术教程合集<br><span class="grad">打开即用，边学边练</span></h1>
      <p class="hero-desc">覆盖 AI 智能体、Python、Java、大数据、基础设施、系统架构、前端与嵌入式 ${totalCats} 大领域的 ${totalTuts} 个精心制作的单文件 HTML 教程。每个教程均为独立文件，支持交互式学习与代码实时运行。</p>
      <div class="hero-stats">
        <div class="stat"><span class="num">${totalTuts}</span><span class="lbl">教程</span><span class="sep">/</span></div>
        <div class="stat"><span class="num">${totalCats}</span><span class="lbl">分类</span><span class="sep">/</span></div>
        <div class="stat"><span class="num">~115K</span><span class="lbl">行代码</span></div>
      </div>
    </section>
  `;

  // Category sections
  for(const cat of categories){
    html += `<section class="cat-section" id="cat-${cat.id}">
      <div class="cat-header">
        <div class="card-icon-box ${cat.iconBg}">${I[cat.icon]}</div>
        <span class="cat-title">${escapeHtml(cat.label)}</span>
        <span class="cat-count">${cat.tutorials.length}</span>
        <span class="cat-link" onclick="scrollToSection('${cat.id}')">查看全部 ${I.arrow}</span>
      </div>
      <div class="cards-grid">`;
    for(const t of cat.tutorials){
      html += `<a class="tut-card" style="--card-accent:${cat.accent}" onclick="openTutorial('${escapeHtml(t.t)}')" >
        <div class="card-top">
          <div class="card-icon ${cat.iconBg}">${I[t.icon] || I.book}</div>
          <h4>${escapeHtml(t.t)}</h4>
        </div>
        <p class="card-desc">${escapeHtml(t.d)}</p>
        <div class="card-tags">`;
      for(const tag of t.tags){
        html += `<span class="tag ${tag.c}">${escapeHtml(tag.l)}</span>`;
      }
      html += `</div>
        <div class="card-meta">
          <span>${I.clock}${t.time}min</span>
          <span>${I.eye}${t.views}</span>
          <span>${I.calendar}${t.date}</span>
        </div>
      </a>`;
    }
    html += `</div></section>`;
  }

  el.innerHTML = html;
}

/* ═══════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════ */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});closeSidebar();setActiveNav('home')}
function scrollToSection(id){document.getElementById('cat-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});closeSidebar();setActiveNav(id)}
function openTutorial(title){
  showToast({
    title:'准备打开教程',
    desc:title + '（原型演示 — 实际实现时将加载对应 HTML 到 iframe）',
    icon:I.book,iconBg:'ic-bg-blue'
  });
}
function goHome(){scrollToTop()}

/* ═══════════════════════════════════════════════════
   Toast Notification
   ═══════════════════════════════════════════════════ */
function showToast({title,desc,icon,iconBg,duration=4000}){
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.setAttribute('role','alert');
  toast.innerHTML = `
    <div class="toast-icon ${iconBg||'ic-bg-blue'}">${icon||I.book}</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      <div class="toast-desc">${escapeHtml(desc)}</div>
    </div>
    <button class="toast-close" aria-label="关闭通知">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  `;
  const closeBtn = toast.querySelector('.toast-close');
  let timer;
  const dismiss = ()=>{
    clearTimeout(timer);
    toast.classList.add('toast-out');
    setTimeout(()=>toast.remove(),200);
  };
  closeBtn.addEventListener('click',dismiss);
  container.appendChild(toast);
  timer = setTimeout(dismiss,duration);
}

/* ═══════════════════════════════════════════════════
   Sidebar Active State (Scroll Spy)
   ═══════════════════════════════════════════════════ */
function setActiveNav(catId){
  // Remove active from all nav items and cat labels
  document.querySelectorAll('.sidebar .nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.sidebar .cat-label').forEach(l=>l.classList.remove('cat-active'));
  if(catId === 'home'){
    document.getElementById('nav-home')?.classList.add('active');
  } else {
    // Highlight the category label for the active section
    document.getElementById('cat-label-'+catId)?.classList.add('cat-active');
  }
}

/* ═══════════════════════════════════════════════════
   Theme Toggle
   ═══════════════════════════════════════════════════ */
function toggleTheme(){
  const html = document.documentElement;
  const cur = html.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('iconMoon').style.display = next === 'dark' ? 'none' : 'block';
  document.getElementById('iconSun').style.display = next === 'dark' ? 'block' : 'none';
  try{localStorage.setItem('devportal-theme',next)}catch(e){}
}

/* ═══════════════════════════════════════════════════
   Mobile Sidebar
   ═══════════════════════════════════════════════════ */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}

/* ═══════════════════════════════════════════════════
   Command Palette
   ═══════════════════════════════════════════════════ */
let cmdItems = [];
let cmdSelected = 0;

function buildCmdIndex(){
  cmdItems = [];
  for(const cat of categories){
    for(const t of cat.tutorials){
      cmdItems.push({
        title:t.t, desc:t.d, cat:cat.label, icon:t.icon, iconBg:cat.iconBg,
        tags:t.tags.map(x=>x.l).join(' '),
        searchText:(t.t+' '+t.d+' '+cat.label+' '+t.tags.map(x=>x.l).join(' ')).toLowerCase()
      });
    }
  }
}

function openCmd(){
  document.getElementById('cmdOverlay').classList.add('show');
  const input = document.getElementById('cmdInput');
  input.value = '';
  input.focus();
  renderCmdResults('');
}
function closeCmd(){
  document.getElementById('cmdOverlay').classList.remove('show');
}

function renderCmdResults(query){
  const el = document.getElementById('cmdResults');
  let results = cmdItems;
  if(query.trim()){
    const q = query.toLowerCase().trim();
    results = cmdItems.filter(item => item.searchText.includes(q));
  }
  cmdSelected = 0;
  if(results.length === 0){
    el.innerHTML = '<div class="cmd-empty">未找到匹配的教程 🤔<br>试试搜索 "RAG"、"Java"、"分布式"…</div>';
    el._results = [];
    return;
  }
  // Group by category, preserving DOM render order
  const groups = {};
  const groupOrder = [];
  for(const r of results){
    if(!groups[r.cat]){groups[r.cat]=[];groupOrder.push(r.cat)}
    groups[r.cat].push(r);
  }
  // Build flat array in DOM order (groups concatenated) — fixes idx mismatch
  const flatResults = [];
  let html = '';
  for(const cat of groupOrder){
    const items = groups[cat];
    html += `<div class="cmd-group-label">${escapeHtml(cat)}</div>`;
    for(const item of items){
      const idx = flatResults.length;
      html += `<div class="cmd-item ${idx===0?'selected':''}" data-idx="${idx}" onclick="cmdSelect(${idx})">
        <div class="ci-icon ${item.iconBg}">${I[item.icon] || I.book}</div>
        <div class="ci-info">
          <div class="ci-title">${escapeHtml(item.title)}</div>
          <div class="ci-cat">${escapeHtml(item.cat)}</div>
        </div>
        <span class="ci-enter">↵</span>
      </div>`;
      flatResults.push(item);
    }
  }
  el.innerHTML = html;
  // Store flat results in DOM order for keyboard nav
  el._results = flatResults;
}

function cmdSelect(idx){
  const el = document.getElementById('cmdResults');
  const results = el._results || [];
  if(results[idx]){
    closeCmd();
    openTutorial(results[idx].title);
  }
}

function cmdMove(dir){
  const items = document.querySelectorAll('.cmd-item');
  if(items.length === 0) return;
  items[cmdSelected]?.classList.remove('selected');
  cmdSelected = (cmdSelected + dir + items.length) % items.length;
  items[cmdSelected]?.classList.add('selected');
  items[cmdSelected]?.scrollIntoView({block:'nearest'});
}

/* ═══════════════════════════════════════════════════
   Keyboard Shortcuts
   ═══════════════════════════════════════════════════ */
document.addEventListener('keydown',(e)=>{
  // Cmd/Ctrl + K → open command palette
  if((e.metaKey || e.ctrlKey) && e.key === 'k'){
    e.preventDefault();
    if(document.getElementById('cmdOverlay').classList.contains('show')){
      closeCmd();
    }else{
      openCmd();
    }
    return;
  }
  // Shift + Cmd/Ctrl + L → toggle theme
  if((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'L' || e.key === 'l')){
    e.preventDefault();
    toggleTheme();
    return;
  }
  // Escape → close overlays
  if(e.key === 'Escape'){
    closeCmd();
    closeSidebar();
    return;
  }
  // Command palette navigation
  const cmdOpen = document.getElementById('cmdOverlay').classList.contains('show');
  if(cmdOpen){
    if(e.key === 'ArrowDown'){e.preventDefault();cmdMove(1)}
    else if(e.key === 'ArrowUp'){e.preventDefault();cmdMove(-1)}
    else if(e.key === 'Enter'){e.preventDefault();cmdSelect(cmdSelected)}
    else if(e.key === 'Tab'){e.preventDefault();cmdMove(e.shiftKey?-1:1)}
  }
});

/* ═══════════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════════ */
(function init(){
  // Theme
  try{
    const saved = localStorage.getItem('devportal-theme');
    if(saved === 'dark'){
      document.documentElement.setAttribute('data-theme','dark');
      document.getElementById('iconMoon').style.display = 'none';
      document.getElementById('iconSun').style.display = 'block';
    }
  }catch(e){}

  // Hamburger
  document.getElementById('hamburger').addEventListener('click',()=>{
    const sb = document.getElementById('sidebar');
    if(sb.classList.contains('open')) closeSidebar(); else openSidebar();
  });

  // Cmd input
  document.getElementById('cmdInput').addEventListener('input',(e)=>{
    renderCmdResults(e.target.value);
  });

  // Build & render
  buildCmdIndex();
  renderSidebar();
  renderContent();

  // Scroll spy — track which section is in view
  const spy = new IntersectionObserver((entries)=>{
    for(const entry of entries){
      if(entry.isIntersecting){
        const catId = entry.target.id.replace('cat-','');
        setActiveNav(catId);
      }
    }
  },{rootMargin:'-30% 0px -60% 0px',threshold:0});
  document.querySelectorAll('.cat-section').forEach(s=>spy.observe(s));

  // Hero spy — when at top, highlight home
  const heroEl = document.querySelector('.hero');
  if(heroEl){
    const heroSpy = new IntersectionObserver((entries)=>{
      for(const entry of entries){
        if(entry.isIntersecting) setActiveNav('home');
      }
    },{rootMargin:'0px 0px -70% 0px',threshold:0});
    heroSpy.observe(heroEl);
  }
})();
</script>
