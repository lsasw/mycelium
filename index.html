<style>
/* ═══════════════════════════════════════════════════════════
   Garden Design Tokens
   ═══════════════════════════════════════════════════════════ */
:root{
  /* Forest palette */
  --forest-50:#f3f8f3;
  --forest-100:#e3efe5;
  --forest-200:#c8dfcc;
  --forest-300:#a0c8a8;
  --forest-400:#6fac7c;
  --forest-500:#3f8d54;
  --forest-600:#2f7a4f;
  --forest-700:#265d3e;
  --forest-800:#1d4430;
  --forest-900:#0f2a1d;

  /* Sand / paper */
  --sand-50:#fbfaf6;
  --sand-100:#f5f1e8;
  --sand-200:#ede7d6;

  /* Ink (text) */
  --ink-900:#1f2421;
  --ink-700:#3d4842;
  --ink-500:#6b756f;
  --ink-300:#9aa49d;
  --ink-100:#d8ddd9;

  /* Accent */
  --amber-500:#d97706;
  --amber-100:#fef3c7;
  --rose-500:#c43d57;

  /* Mapped */
  --bg:var(--sand-50);
  --bg-subtle:var(--sand-100);
  --surface:#ffffff;
  --surface-hover:var(--sand-50);
  --border:rgba(31,36,33,.08);
  --border-strong:rgba(31,36,33,.16);
  --text:var(--ink-900);
  --text-2:var(--ink-700);
  --text-3:var(--ink-500);
  --primary:var(--forest-600);
  --primary-hover:var(--forest-700);
  --primary-soft:var(--forest-100);

  --shadow-sm:0 1px 2px rgba(31,36,33,.04);
  --shadow:0 2px 8px rgba(31,36,33,.06);
  --shadow-md:0 8px 24px rgba(31,36,33,.10);
  --shadow-lg:0 24px 48px rgba(31,36,33,.12);

  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-serif:'Source Serif Pro','Songti SC',Georgia,serif;
  --font-mono:'JetBrains Mono','Cascadia Code',Consolas,monospace;

  --topbar-h:64px;
  --sidebar-w:260px;

  --r-sm:6px;
  --r:10px;
  --r-md:14px;
  --r-lg:20px;
}

[data-theme="dark"]{
  --bg:#0f1a14;
  --bg-subtle:#16221a;
  --surface:#1c2a22;
  --surface-hover:#243429;
  --border:rgba(255,255,255,.06);
  --border-strong:rgba(255,255,255,.12);
  --text:#e8ede9;
  --text-2:#b9c1bb;
  --text-3:#7c857f;
  --primary:var(--forest-400);
  --primary-hover:var(--forest-300);
  --primary-soft:rgba(111,172,124,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 24px 48px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.6;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ═══════════════════════════════════════════════════
   Layout
   ═══════════════════════════════════════════════════ */
body{display:grid;grid-template-rows:var(--topbar-h) 1fr;height:100vh;overflow:hidden}

.topbar{
  display:flex;align-items:center;gap:16px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  z-index:10;
}
.topbar .brand{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-serif);
  font-size:18px;font-weight:600;
  letter-spacing:.2px;
}
.topbar .brand .leaf{font-size:22px}
.topbar .brand small{
  font-family:var(--font-sans);
  font-size:11px;font-weight:400;
  color:var(--text-3);
  margin-left:4px;
}
.topbar .search-trigger{
  display:flex;align-items:center;gap:8px;
  flex:1;max-width:420px;
  padding:7px 12px;
  background:var(--bg-subtle);
  border:1px solid var(--border);
  border-radius:var(--r);
  color:var(--text-3);
  font-size:13px;
  transition:all .15s ease;
}
.topbar .search-trigger:hover{border-color:var(--primary)}
.topbar .search-trigger kbd{
  margin-left:auto;
  padding:2px 6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-2);
}
.topbar .spacer{flex:1}
.topbar .actions{display:flex;align-items:center;gap:4px}
.topbar .actions button{
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:var(--r);
  color:var(--text-2);
  font-size:15px;
  transition:all .15s ease;
}
.topbar .actions button:hover{background:var(--bg-subtle);color:var(--text)}
.topbar .actions .btn-text{padding:0 12px;width:auto;height:34px;font-size:13px;font-weight:500}

.view-switcher{
  display:flex;gap:2px;
  padding:3px;
  background:var(--bg-subtle);
  border-radius:var(--r);
  margin-left:8px;
}
.view-switcher button{
  padding:5px 12px;
  border-radius:7px;
  font-size:12px;font-weight:500;
  color:var(--text-3);
}
.view-switcher button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.view-switcher button:not(.active):hover{color:var(--text)}

/* Sidebar */
.layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden;height:100%}
.sidebar{
  border-right:1px solid var(--border);
  background:var(--surface);
  overflow-y:auto;
  padding:16px 12px;
}
.sidebar h4{
  font-size:11px;font-weight:600;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--text-3);
  padding:14px 12px 8px;
}
.sidebar h4:first-child{padding-top:4px}
.nav-group{margin-bottom:8px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:6px 12px;
  border-radius:var(--r-sm);
  font-size:13px;
  color:var(--text-2);
  cursor:pointer;
  position:relative;
  transition:all .12s ease;
}
.nav-item:hover{background:var(--bg-subtle);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .count{
  margin-left:auto;
  font-size:11px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}
.nav-item.muted{opacity:.55;font-size:12px}
.nav-item .badge{
  width:6px;height:6px;border-radius:50%;background:var(--forest-400);flex:none;
}
.nav-item .badge.seedling{background:#a0c8a8}
.nav-item .badge.budding{background:#7fb484}
.nav-item .badge.evergreen{background:#2f7a4f}
.nav-item .badge.untended{background:var(--ink-100)}

/* Main */
main{
  overflow-y:auto;
  background:var(--bg);
  padding:32px 40px;
}

/* Hero (welcome) */
.hero{
  max-width:720px;
  margin:0 auto 40px;
  padding-bottom:32px;
  border-bottom:1px dashed var(--border-strong);
}
.hero h1{
  font-family:var(--font-serif);
  font-size:36px;
  font-weight:600;
  letter-spacing:-.5px;
  margin-bottom:12px;
  line-height:1.2;
}
.hero h1 .accent{color:var(--primary)}
.hero p{
  font-size:15px;color:var(--text-2);
  line-height:1.7;
}
.hero .stats{
  display:flex;gap:24px;
  margin-top:20px;
  font-size:12px;color:var(--text-3);
}
.hero .stats strong{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;margin-right:4px}

/* Section header */
.section-h{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:16px;
}
.section-h h2{
  font-family:var(--font-serif);
  font-size:22px;font-weight:600;
  letter-spacing:-.2px;
}
.section-h .sub{font-size:12px;color:var(--text-3)}

/* Card grid */
.card-grid{
  max-width:1280px;margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:18px;
  cursor:pointer;
  position:relative;
  display:flex;flex-direction:column;
  gap:10px;
  transition:all .18s ease;
  overflow:hidden;
}
.card:hover{
  border-color:var(--primary);
  box-shadow:var(--shadow-md);
  transform:translateY(-2px);
}
.card.untended{opacity:.55}
.card.untended:hover{opacity:.85}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .cat{
  font-size:10px;font-weight:600;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--primary);
  padding:3px 8px;
  background:var(--primary-soft);
  border-radius:99px;
}
.card .mat-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--forest-400);
  flex:none;
  box-shadow:0 0 0 3px var(--bg);
}
.card .mat-dot.m0{background:var(--ink-100)}
.card .mat-dot.m1,#all-m1{background:#c8dfcc}
.card .mat-dot.m2{background:#a0c8a8}
.card .mat-dot.m3{background:#6fac7c}
.card .mat-dot.m4{background:#3f8d54}
.card .mat-dot.m5{background:#265d3e}
.card h3{
  font-size:15px;font-weight:600;
  line-height:1.4;
  letter-spacing:-.1px;
}
.card p{
  font-size:13px;color:var(--text-2);
  line-height:1.6;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.card .tag{
  font-size:10.5px;font-weight:500;
  padding:2px 8px;
  background:var(--bg-subtle);
  color:var(--text-2);
  border-radius:99px;
}
.card .meta{
  margin-top:auto;
  padding-top:12px;
  border-top:1px dashed var(--border);
  display:flex;justify-content:space-between;
  font-size:11px;
  color:var(--text-3);
  font-variant-numeric:tabular-nums;
  font-family:var(--font-mono);
}
.card .meta .ref{color:var(--primary);font-weight:600}

/* Timeline */
.timeline{
  max-width:800px;margin:0 auto;
  position:relative;
  padding-left:32px;
}
.timeline::before{
  content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2px;
  background:var(--border-strong);
}
.timeline-item{
  position:relative;padding-bottom:32px;
  cursor:pointer;
}
.timeline-item::before{
  content:'';position:absolute;left:-25px;top:6px;width:14px;height:14px;
  border-radius:50%;
  background:var(--surface);
  border:3px solid var(--primary);
}
.timeline-item.m0::before{border-color:var(--ink-300)}
.timeline-item .date{
  font-family:var(--font-mono);
  font-size:11px;color:var(--text-3);
  margin-bottom:4px;
  letter-spacing:.5px;
}
.timeline-item h3{
  font-family:var(--font-serif);
  font-size:18px;font-weight:600;
  margin-bottom:4px;
}
.timeline-item .desc{font-size:13px;color:var(--text-2);margin-bottom:8px;line-height:1.6}
.timeline-item .tags{display:flex;gap:6px;flex-wrap:wrap}
.timeline-item .tag{font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}

/* Graph */
.graph-wrap{
  max-width:1280px;margin:0 auto;
  height:calc(100vh - var(--topbar-h) - 64px - 64px);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  position:relative;
  overflow:hidden;
}
.graph-wrap svg{width:100%;height:100%;display:block}
.graph-legend{
  position:absolute;top:12px;left:12px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:8px 12px;
  font-size:11px;color:var(--text-2);
  z-index:2;
}
[data-theme="dark"] .graph-legend{background:rgba(28,42,34,.85)}
.graph-legend .row{display:flex;align-items:center;gap:6px;padding:2px 0}
.graph-legend .d{width:10px;height:10px;border-radius:50%}
.graph-hint{
  position:absolute;bottom:12px;left:12px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:6px 10px;
  font-size:11px;color:var(--text-3);
  font-family:var(--font-mono);
  z-index:2;
}
[data-theme="dark"] .graph-hint{background:rgba(28,42,34,.85)}

/* Detail */
.detail{
  max-width:920px;margin:0 auto;
}
.detail-bar{
  display:flex;align-items:center;gap:8px;
  margin-bottom:24px;
  font-size:12px;color:var(--text-3);
}
.detail-bar .back{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;
  border-radius:var(--r);
  background:var(--surface);
  border:1px solid var(--border);
  font-weight:500;color:var(--text-2);
}
.detail-bar .back:hover{border-color:var(--primary);color:var(--primary)}
.detail-header{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:32px;
  margin-bottom:24px;
  position:relative;
  overflow:hidden;
}
.detail-header::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--primary);
}
.detail-header .crumb{font-size:11px;color:var(--text-3);font-family:var(--font-mono);letter-spacing:.5px;margin-bottom:8px}
.detail-header h1{
  font-family:var(--font-serif);
  font-size:32px;font-weight:600;
  letter-spacing:-.5px;
  margin-bottom:12px;
  line-height:1.25;
}
.detail-header .desc{
  font-size:15px;color:var(--text-2);line-height:1.7;
  margin-bottom:16px;
}
.detail-header .meta-row{
  display:flex;flex-wrap:wrap;gap:12px;
  font-size:12px;color:var(--text-3);
}
.detail-header .meta-row .chip{
  padding:4px 10px;
  background:var(--bg-subtle);
  border-radius:99px;
}
.detail-header .meta-row .chip strong{color:var(--text);font-weight:600}

.detail-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:24px;
  margin-bottom:16px;
}
.detail-section h3{
  font-size:13px;font-weight:600;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--text-3);
  margin-bottom:14px;
}
.detail-tabs{
  display:flex;gap:6px;align-items:center;
  padding:5px;
  background:var(--bg-subtle);
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:14px;
}
.detail-tabs .tab{
  background:transparent;border:none;
  padding:7px 14px;border-radius:8px;
  font:inherit;font-size:13px;
  color:var(--text-2);cursor:pointer;
  transition:all .12s;
}
.detail-tabs .tab:hover{background:var(--surface);color:var(--text)}
.detail-tabs .tab.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:500}
.detail-tabs .tab-spacer{flex:1}
.detail-tabs .tab-external{
  font-size:12px;color:var(--text-3);
  text-decoration:none;
  padding:6px 10px;border-radius:6px;
  white-space:nowrap;
}
.detail-tabs .tab-external:hover{color:var(--primary);background:var(--surface)}

.embed-frame-wrap{
  width:100%;
  height:78vh;min-height:520px;
  background:var(--bg-subtle);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  overflow:hidden;
  position:relative;
}
.embed-frame-wrap iframe{
  width:100%;height:100%;
  border:none;display:block;
  background:#fff;
}
.embed-tip{
  margin-top:10px;
  font-size:12px;color:var(--text-3);
  line-height:1.6;
}
.embed-tip code{
  background:var(--surface);padding:1px 6px;border-radius:4px;
  font-size:11px;
}
.detail-panel[hidden]{display:none !important}
.related-list{display:flex;flex-direction:column;gap:8px}
.related-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  background:var(--bg-subtle);
  border-radius:var(--r);
  cursor:pointer;
  transition:all .12s ease;
}
.related-item:hover{background:var(--primary-soft);color:var(--primary)}
.related-item .mat-dot{width:8px;height:8px;border-radius:50%;background:var(--forest-400);flex:none}
.related-item.m0 .mat-dot{background:var(--ink-100)}
.related-item.m1 .mat-dot{background:#c8dfcc}
.related-item.m2 .mat-dot{background:#a0c8a8}
.related-item.m3 .mat-dot{background:#6fac7c}
.related-item.m4 .mat-dot{background:#3f8d54}
.related-item.m5 .mat-dot{background:#265d3e}
.related-item .title{font-size:13px;font-weight:500;flex:1}
.related-item .arrow{color:var(--text-3);font-size:14px}
.related-item .arrow:hover{color:var(--primary)}
.related-arrow{text-align:center;font-size:11px;color:var(--text-3);padding:2px 0;font-family:var(--font-mono)}

.notes-area{
  width:100%;min-height:120px;
  padding:12px 14px;
  background:var(--bg-subtle);
  border:1px solid var(--border);
  border-radius:var(--r);
  font-size:13px;line-height:1.7;
  resize:vertical;
  font-family:var(--font-serif);
  color:var(--text);
}
.notes-area:focus{border-color:var(--primary);background:var(--surface)}
.notes-area::placeholder{color:var(--text-3);font-style:italic}
.notes-meta{font-size:11px;color:var(--text-3);margin-top:6px;font-family:var(--font-mono);display:flex;justify-content:space-between}

.action-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  padding:9px 16px;
  border-radius:var(--r);
  font-size:13px;font-weight:500;
  background:var(--primary);
  color:#fff;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .12s ease;
}
.btn:hover{background:var(--primary-hover)}
.btn.secondary{background:var(--bg-subtle);color:var(--text-2);border:1px solid var(--border)}
.btn.secondary:hover{background:var(--surface);border-color:var(--primary);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--text-2);padding:9px 12px}
.btn.ghost:hover{color:var(--primary)}

/* Command palette */
.cmd-overlay{
  position:fixed;inset:0;
  background:rgba(15,26,20,.4);
  backdrop-filter:blur(2px);
  z-index:100;
  display:none;
  align-items:flex-start;justify-content:center;
  padding-top:12vh;
}
.cmd-overlay.open{display:flex}
.cmd-panel{
  width:min(640px,90vw);
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  display:flex;flex-direction:column;
  max-height:60vh;
}
.cmd-input{
  padding:16px 20px;
  font-size:15px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.cmd-input input{
  flex:1;font-size:15px;
  background:transparent;
}
.cmd-input input::placeholder{color:var(--text-3)}
.cmd-results{
  flex:1;overflow-y:auto;
  padding:8px;
}

  padding:10px 12px;
  border-radius:var(--r-sm);
  cursor:pointer;
  font-size:13px;
}
.cmd-item.active,.cmd-item:hover{background:var(--primary-soft);color:var(--primary)}
.cmd-item .mat-dot{width:8px;height:8px;border-radius:50%;background:var(--forest-400);flex:none}
.cmd-item .title{flex:1}
.cmd-item .cat{font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}
.cmd-empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:13px}

/* Tag filter pills */
.filter-pills{
  max-width:1280px;margin:0 auto 16px;
  display:flex;gap:6px;flex-wrap:wrap;
  align-items:center;
}
.filter-pills .pill{
  padding:5px 12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:99px;
  font-size:12px;
  cursor:pointer;
  transition:all .12s ease;
}
.filter-pills .pill:hover{border-color:var(--primary)}
.filter-pills .pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-pills .clear{font-size:11px;color:var(--text-3);padding:5px 8px;background:none;cursor:pointer}
.filter-pills .clear:hover{color:var(--primary)}

/* Tag view (when nav hits tag) */
.tag-view{max-width:1280px;margin:0 auto}
.tag-view h2{font-family:var(--font-serif);font-size:28px;margin-bottom:8px}
.tag-view .tag-sub{color:var(--text-3);font-size:13px;margin-bottom:24px}

/* Recent / Favourites listing similar to card-grid */

/* Empty */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--text-3);
}
.empty .icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty h3{font-size:18px;color:var(--text-2);margin-bottom:6px}

/* Toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:10px 18px;
  background:var(--ink-900);color:#fff;
  border-radius:var(--r);
  font-size:13px;
  box-shadow:var(--shadow-md);
  opacity:0;
  transition:all .25s ease;
  z-index:200;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Mobile responsive */
@media(max-width:900px){
  :root{--sidebar-w:0px}
  body{font-size:13px}
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  main{padding:20px 16px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .topbar{padding:0 12px;gap:8px}
  .topbar .actions .btn-text{display:none}
  .hero h1{font-size:28px}
  .detail-header{padding:20px}
  .detail-header h1{font-size:24px}
}

/* Animation */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .3s ease}

/* Markdown-ish rendered note */
.note-rendered p{margin-bottom:8px}
.note-rendered code{
  font-family:var(--font-mono);font-size:12px;
  background:var(--bg-subtle);padding:2px 6px;border-radius:4px;
}

/* Scrollbar in graph svg handles */
.graph-handle{cursor:grab}
.graph-handle:active{cursor:grabbing}

<!-- D3.js for the graph view (CDN, gracefully degrades) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>

<script>
/* ═══════════════════════════════════════════════════
   Garden runtime
   ═══════════════════════════════════════════════════ */
(function(){
'use strict';

// ─── Data loading (from inline <script type=application/json>) ───
const manifestEl=document.getElementById('manifest-data');
let MANIFEST;
try{
  MANIFEST=JSON.parse(manifestEl.textContent);
}catch(e){
  console.error('manifest parse fail',e);
  document.getElementById('main').innerHTML='<div class="empty"><div class="icon">⚠️</div><h3>manifest 解析失败</h3><p>'+e.message+'</p></div>';
  return;
}
const NOTES=MANIFEST.notes;
const BY_ID=new Map(NOTES.map(n=>[n.id,n]));

// ─── State (localStorage-backed) ───
const STORE_KEY='garden.state.v2';
const THEME_KEY='garden.theme';
const VIEW_KEY='garden.view';
let state=loadState();
function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
    return {
      favourites:new Set(raw.favourites||[]),
      recent:raw.recent||[],
      notes:raw.notes||{},
      streak:raw.streak||0,
      lastVisit:raw.lastVisit||null
    };
  }catch{return {favourites:new Set(),recent:[],notes:{},streak:0,lastVisit:null}}
}
function saveState(){
  const s={
    favourites:[...state.favourites],
    recent:state.recent,
    notes:state.notes,
    streak:state.streak,
    lastVisit:state.lastVisit
  };
  localStorage.setItem(STORE_KEY,JSON.stringify(s));
}
state.recent=state.recent||[];

// visit streak
const today=new Date().toISOString().slice(0,10);
if(state.lastVisit!==today){
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streak=(state.lastVisit===yesterday)?(state.streak+1):1;
  state.lastVisit=today;
  saveState();
}

// Theme
let theme=localStorage.getItem(THEME_KEY)||'light';
document.documentElement.dataset.theme=theme;

// Current view
let currentView=localStorage.getItem(VIEW_KEY)||'garden-home';
let currentCat=null;
let currentNote=null;
let detailStack=[]; // for "back" navigation
let currentDetailTab=localStorage.getItem('mycelium:detailTab')||'embed'; // 'embed' | 'summary'
let activeTags=new Set(); // tag filter (multi-select on cards view)

// ─── Reverse-link index (cached) ───
const REVERSE=new Map();
NOTES.forEach(n=>(n.related||[]).forEach(r=>{
  if(!REVERSE.has(r))REVERSE.set(r,new Set());
  REVERSE.get(r).add(n.id);
}));
function refsOf(id){return (BY_ID.get(id)?.related||[]).map(r=>BY_ID.get(r)).filter(Boolean)}
function backRefsOf(id){return [...(REVERSE.get(id)||[])].map(r=>BY_ID.get(r)).filter(Boolean)}

// ─── Maturity helpers ───
function maturityBucket(m){
  if(m===0)return'untended';
  if(m<=1)return'seedling';
  if(m<=2)return'seedling';
  if(m<=3)return'budding';
  return'evergreen';
}
function maturityLabel(m){
  if(m===0)return'未打理';
  if(m<=1)return'🌱 种子';
  if(m<=2)return'🌱 种子';
  if(m<=3)return'🌿 抽芽';
  if(m<=4)return'🌳 常青';
  return'🌳 常青';
}

// ─── Sidebar render ───
function renderSidebar(){
  const cats=new Map();
  NOTES.forEach(n=>{
    const k=n.cat||'未分类';
    cats.set(k,(cats.get(k)||0)+1);
  });
  const catNav=document.getElementById('cat-nav');
  catNav.innerHTML=[...cats.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const sample=NOTES.find(n=>n.cat===k);
    const m=sample?sample.maturity:0;
    return `<div class="nav-item${currentCat===k?' active':''}" data-cat="${escapeAttr(k)}">
      <span class="badge ${maturityBucket(m)}"></span>${escapeHtml(k)}
      <span class="count">${v}</span>
    </div>`;
  }).join('');
  document.getElementById('count-all').textContent=NOTES.length;
  document.getElementById('count-tended').textContent=NOTES.filter(n=>n.maturity>0).length;
  document.getElementById('count-seed').textContent=NOTES.filter(n=>n.maturity>0&&n.maturity<=2).length;
  document.getElementById('count-fav').textContent=state.favourites.size;
  document.getElementById('count-recent').textContent=state.recent.length;
  document.getElementById('count-notes').textContent=Object.keys(state.notes).filter(k=>state.notes[k]?.trim()).length;

  document.querySelectorAll('#sidebar .nav-item').forEach(el=>{
    el.onclick=()=>{
      if(el.dataset.view){
        currentView=el.dataset.view;currentCat=null;activeTags.clear();
        localStorage.setItem(VIEW_KEY,currentView);
      }else if(el.dataset.cat){
        currentView='cat';currentCat=el.dataset.cat;activeTags.clear();
      }
      render();
    };
  });
}

// ─── View switching (topbar) ───
document.querySelectorAll('.view-switcher button').forEach(b=>{
  b.onclick=()=>{
    if(currentNote){return}
    currentView=currentView+':'+b.dataset.view;
    localStorage.setItem(VIEW_KEY,currentView);
    render();
  };
});

function toggleViewSwitcher(visible,kind){
  const wrap=document.getElementById('view-switcher');
  wrap.hidden=!visible;
  if(kind){
    [...wrap.querySelectorAll('button')].forEach(b=>{
      b.classList.toggle('active',b.dataset.view===kind);
    });
  }
}

// ─── Util ───
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function uniqSet(s){return[...new Set(s)]}
function pluralize(n,w){return n+' '+w+(n>1?(w.endsWith('s')?'':'s'):'')}
function relTime(date){
  if(!date)return'从未打理';
  const d=new Date(date),now=Date.now();
  const diff=Math.floor((now-d.getTime())/86400000);
  if(diff<0)return '刚刚';
  if(diff===0)return '今天';
  if(diff===1)return '昨天';
  if(diff<7)return diff+' 天前';
  if(diff<30)return Math.floor(diff/7)+' 周前';
  if(diff<365)return Math.floor(diff/30)+' 月前';
  return Math.floor(diff/365)+' 年前';
}
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

// ─── Card render ───
function cardHTML(n,opts={}){
  const backCount=backRefsOf(n.id).length;
  const isFav=state.favourites.has(n.id);
  const untended=n.maturity===0;
  return `
    <div class="card ${untended?'untended':''}" data-id="${escapeAttr(n.id)}">
      <div class="top">
        <span class="cat">${escapeHtml(n.cat||'未分类')}</span>
        <span class="mat-dot m${n.maturity}" title="成熟度 ${n.maturity}/5 · ${maturityLabel(n.maturity)}"></span>
      </div>
      <h3>${escapeHtml(n.title)}</h3>
      <p>${escapeHtml(n.desc)}</p>
      <div class="tags">${(n.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
      <div class="meta">
        <span>${relTime(n.tended||n.updated)}</span>
        <span>${backCount>0?`<span class="ref">${'🔁 '+backCount}</span>`:''}${isFav?' ⭐':''}</span>
      </div>
    </div>`;
}

function filteredNotes(){
  return NOTES.filter(n=>{
    if(currentCat)return n.cat===currentCat;
    return true;
  }).filter(n=>{
    if(activeTags.size===0)return true;
    const tags=n.tags||[];
    return[...activeTags].every(t=>tags.includes(t));
  });
}

// ─── Views ───
function viewGardenHome(){
  const evergreen=NOTES.filter(n=>n.maturity>=4).sort((a,b)=>(b.tended||b.updated).localeCompare(a.tended||a.updated)).slice(0,6);
  const seedlings=NOTES.filter(n=>n.maturity>0&&n.maturity<=3).slice(0,6);
  const recent=NOTES.filter(n=>n.maturity>0).sort((a,b)=>(b.tended||b.updated).localeCompare(a.tended||a.updated)).slice(0,8);
  const tucked=NOTES.filter(n=>n.maturity===0).slice(0,4);

  return `
    <div class="hero fade-in">
      <h1><span class="accent">${state.streak}</span> 天，你持续来花园了</h1>
      <p>这里放着 ${NOTES.length} 张笔记卡片，其中 ${NOTES.filter(n=>n.maturity>0).length} 张已打理、${NOTES.filter(n=>n.maturity===0).length} 张等待开荒。每张笔记都在持续长大。</p>
      <div class="stats">
        <div><strong>${state.favourites.size}</strong> 收藏</div>
        <div><strong>${state.recent.length}</strong> 最近浏览</div>
        <div><strong>${Object.values(state.notes).filter(v=>v&&v.trim()).length}</strong> 我的笔记</div>
        <div><strong>${uniqSet(NOTES.flatMap(n=>n.tags||[])).length}</strong> 标签</div>
      </div>
    </div>

    <div class="section-h">
      <h2>🌳 常青精选</h2>
      <span class="sub">maturity 4-5 · 已完结</span>
    </div>
    <div class="card-grid">${evergreen.map(cardHTML).join('')||'<div class="empty">还没有常青笔记 ✨</div>'}</div>

    <div class="section-h" style="margin-top:48px">
      <h2>🌱 正在长</h2>
      <span class="sub">maturity 1-3 · 持续打磨</span>
    </div>
    <div class="card-grid">${seedlings.map(cardHTML).join('')||'<div class="empty">还没有种子期笔记 🌱</div>'}</div>

    <div class="section-h" style="margin-top:48px">
      <h2>🕘 近期打理</h2>
      <span class="sub">最近更新的笔记</span>
    </div>
    <div class="card-grid">${recent.map(cardHTML).join('')}</div>

    ${tucked.length?`
    <div class="section-h" style="margin-top:48px">
      <h2>🪴 待开荒</h2>
      <span class="sub">已经写完，待补充关系与笔记</span>
    </div>
    <div class="card-grid">${tucked.map(cardHTML).join('')}</div>
    `:''}
  `;
}

function viewCards(){
  const list=filteredNotes();
  const evergreen=list.filter(n=>n.maturity>=4);
  const budding=list.filter(n=>n.maturity>0&&n.maturity<4);
  const untended=list.filter(n=>n.maturity===0);
  return `
    <div class="section-h">
      <h2>${currentCat?'📂 '+currentCat:'📚 全部笔记'}</h2>
      <span class="sub">${list.length} 张 · 已打理 ${list.length-untended.length} · 待开荒 ${untended.length}</span>
    </div>
    ${tagFilterPillsHTML()}
    ${evergreen.length?`<h3 style="font-family:var(--font-serif);font-size:18px;margin:24px 0 12px;color:var(--text-2)">🌳 常青 <span style="font-size:12px;color:var(--text-3);font-family:var(--font-mono)">${evergreen.length}</span></h3><div class="card-grid">${evergreen.map(cardHTML).join('')}</div>`:''}
    ${budding.length?`<h3 style="font-family:var(--font-serif);font-size:18px;margin:32px 0 12px;color:var(--text-2)">🌿 抽芽 <span style="font-size:12px;color:var(--text-3);font-family:var(--font-mono)">${budding.length}</span></h3><div class="card-grid">${budding.map(cardHTML).join('')}</div>`:''}
    ${untended.length?`<h3 style="font-family:var(--font-serif);font-size:18px;margin:32px 0 12px;color:var(--text-2)">🪴 待开荒 <span style="font-size:12px;color:var(--text-3);font-family:var(--font-mono)">${untended.length}</span></h3><div class="card-grid">${untended.map(cardHTML).join('')}</div>`:''}
    ${list.length===0?'<div class="empty"><div class="icon">🪴</div><h3>这片园子是空的</h3></div>':''}
  `;
}

function tagFilterPillsHTML(){
  const tagSet=new Set();
  filteredNotes().forEach(n=>(n.tags||[]).forEach(t=>tagSet.add(t)));
  if(tagSet.size===0)return'';
  const tags=[...tagSet].sort();
  return `<div class="filter-pills">${activeTags.size>0?`<button class="clear" id="clear-tags">清除筛选 ×</button>`:''}${tags.map(t=>`<button class="pill ${activeTags.has(t)?'active':''}" data-tag="${escapeAttr(t)}">${escapeHtml(t)}</button>`).join('')}</div>`;
}

function viewTimeline(){
  const list=filteredNotes().slice().sort((a,b)=>(b.updated||b.created||'').localeCompare(a.updated||a.created||''));
  if(!list.length)return'<div class="empty"><div class="icon">⏳</div><h3>时间线为空</h3></div>';
  // group by month
  const groups={};
  list.forEach(n=>{
    const k=(n.updated||n.created||'').slice(0,7)||'未知';
    (groups[k]=groups[k]||[]).push(n);
  });
  return `
    <div class="section-h">
      <h2>⏳ 时间线</h2>
      <span class="sub">按更新时间倒序</span>
    </div>
    <div class="timeline">
      ${Object.entries(groups).map(([month,items])=>{
        const label=month==='未知'?'未知':(function(){
          const [y,m]=month.split('-');
          return `${y} 年 ${parseInt(m)} 月`;
        })();
        return `<h3 style="font-family:var(--font-serif);font-size:18px;margin:32px 0 12px;color:var(--text-2);text-align:center">${label}</h3>`+
          items.map(n=>{
            const dateStr=(n.updated||n.created||'').slice(0,10);
            return `<div class="timeline-item m${n.maturity}" data-id="${escapeAttr(n.id)}">
              <div class="date">${dateStr}</div>
              <h3>${escapeHtml(n.title)}</h3>
              <div class="desc">${escapeHtml(n.desc)}</div>
              <div class="tags">${(n.tags||[]).slice(0,5).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
            </div>`;
          }).join('');
      }).join('')}
    </div>
  `;
}

function viewGraph(){
  const list=filteredNotes().filter(n=>n.maturity>0||(n.related||[]).length>0);
  if(!list.length)return'<div class="empty"><div class="icon">🌐</div><h3>图谱为空</h3><p>先在花园里打理几张笔记，建立关联，图谱才会显现。</p></div>';
  if(typeof d3==='undefined')return'<div class="empty"><div class="icon">🌐</div><h3>图谱引擎未加载</h3><p>需要联网加载 D3.js。当前 CDN 不可达，请检查网络。</p></div>';

  const links=[];
  list.forEach(n=>(n.related||[]).forEach(r=>{
    if(BY_ID.has(r))links.push({source:n.id,target:r});
  }));

  return `
    <div class="section-h">
      <h2>🌐 知识图谱</h2>
      <span class="sub">${list.length} 节点 · ${links.length} 关联</span>
    </div>
    <div class="graph-wrap" id="graph-wrap">
      <div class="graph-legend">
        <div class="row"><span class="d" style="background:#265d3e"></span>常青 4-5</div>
        <div class="row"><span class="d" style="background:#6fac7c"></span>抽芽 3</div>
        <div class="row"><span class="d" style="background:#c8dfcc"></span>种子 1-2</div>
        <div class="row"><span class="d" style="background:#9aa49d"></span>待开荒 0</div>
      </div>
      <svg id="graph-svg"></svg>
      <div class="graph-hint">滚轮缩放 · 拖拽节点 · 点击卡片进入 · 双击节点聚焦</div>
    </div>
  `;
}

function viewFavs(){
  const list=NOTES.filter(n=>state.favourites.has(n.id));
  if(!list.length)return'<div class="empty"><div class="icon">⭐</div><h3>还没有收藏</h3><p>点卡片右上角的星标，或者进详情页就能收藏。</p></div>';
  return `<div class="section-h"><h2>⭐ 收藏</h2><span class="sub">${list.length} 张</span></div><div class="card-grid">${list.map(cardHTML).join('')}</div>`;
}

function viewRecent(){
  const list=state.recent.map(id=>BY_ID.get(id)).filter(Boolean);
  if(!list.length)return'<div class="empty"><div class="icon">🕘</div><h3>最近浏览是空的</h3><p>点开任意笔记，就会在此出现。</p></div>';
  return `<div class="section-h"><h2>🕘 最近浏览</h2><span class="sub">${list.length} 张</span></div><div class="card-grid">${list.map(cardHTML).join('')}</div>`;
}

function viewMyNotes(){
  const entries=Object.entries(state.notes).filter(([,v])=>v&&v.trim()).map(([id,v])=>({note:BY_ID.get(id),text:v})).filter(x=>x.note);
  if(!entries.length)return'<div class="empty"><div class="icon">📝</div><h3>还没有私人笔记</h3><p>进入任意一篇笔记，在底部「🌱 我的笔记」写下想法即可。仅保存在你本地。</p></div>';
  return `
    <div class="section-h"><h2>📝 我的笔记</h2><span class="sub">${entries.length} 条私人留言</span></div>
    <div style="max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:12px">
      ${entries.map(({note,text})=>`
        <div class="detail-section" data-id="${escapeAttr(note.id)}" style="cursor:pointer;padding:18px">
          <div style="font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:6px">${escapeHtml(note.title)}</div>
          <div style="font-size:13px;color:var(--text-2);margin-bottom:10px;line-height:1.7;white-space:pre-wrap">${escapeHtml(text)}</div>
          <div style="font-size:11px;color:var(--text-3);font-family:var(--font-mono)">${escapeHtml(note.cat)} · ${relTime(note.tended||note.updated)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function viewTended(){
  const list=NOTES.filter(n=>n.maturity>0);
  return `<div class="section-h"><h2>✨ 已打理</h2><span class="sub">${list.length} 张</span></div><div class="card-grid">${list.map(cardHTML).join('')}</div>`;
}

function viewSeedlings(){
  const list=NOTES.filter(n=>n.maturity>0&&n.maturity<=2);
  return `<div class="section-h"><h2>🌱 种子期</h2><span class="sub">${list.length} 张 · 正在长</span></div><div class="card-grid">${list.map(cardHTML).join('')}</div>`;
}

function viewAll(){
  return viewCards();
}

function viewCat(){
  return viewCards();
}

// ─── Detail view ───
function openNote(id){
  const n=BY_ID.get(id);
  if(!n)return;
  detailStack.push(currentView+(currentCat?':'+currentCat:''));
  currentNote=n;
  // record recent
  state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,12);
  saveState();
  render();
  mainEl.scrollTop=0;
}

function viewDetail(){
  const n=currentNote;
  if(!n)return viewGardenHome();
  const forward=refsOf(n.id);
  const back=backRefsOf(n.id);
  const isFav=state.favourites.has(n.id);
  const noteText=state.notes[n.id]||'';

  return `
    <div class="detail fade-in">
      <div class="detail-bar">
        <button class="back" id="back-btn">← 返回花园</button>
        <span style="margin:0 8px;color:var(--text-3)">·</span>
        <span>${escapeHtml(n.cat||'未分类')}</span>
      </div>

      <div class="detail-header">
        <div class="crumb">maturity ${n.maturity}/5 · ${maturityLabel(n.maturity)}</div>
        <h1>${escapeHtml(n.title)}</h1>
        <p class="desc">${escapeHtml(n.desc)}</p>
        <div class="meta-row">
          ${n.level?`<span class="chip">难度 <strong>${escapeHtml(n.level)}</strong></span>`:''}
          ${n.status?`<span class="chip">状态 <strong>${escapeHtml(n.status)}</strong></span>`:''}
          ${n.created?`<span class="chip">创建 ${escapeHtml(n.created)}</span>`:''}
          ${n.updated?`<span class="chip">更新 ${escapeHtml(n.updated)}</span>`:''}
          ${n.tended?`<span class="chip">上次打理 <strong>${relTime(n.tended)}</strong></span>`:''}
          ${(n.tags||[]).map(t=>`<span class="chip" style="cursor:pointer" data-tag="${escapeAttr(t)}">${escapeHtml(t)}</span>`).join('')}
        </div>
        <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn secondary" id="fav-btn">${isFav?'⭐ 已收藏':'☆ 收藏'}</button>
          <button class="btn secondary" id="stumble-btn">🎲 随机一篇</button>
        </div>
      </div>

      <div class="detail-tabs" role="tablist">
        <button class="tab ${currentDetailTab==='embed'?'active':''}" data-tab="embed" role="tab">🌐 原文（内嵌）</button>
        <button class="tab ${currentDetailTab==='summary'?'active':''}" data-tab="summary" role="tab">📖 摘要 · 反向链接 · 我的笔记</button>
        <span class="tab-spacer"></span>
        <a class="tab-external" href="${escapeAttr(n.url)}" target="_blank" rel="noopener noreferrer">↗ 新标签打开原文</a>
      </div>

      <div class="detail-panel" data-panel="embed" ${currentDetailTab!=='embed'?'hidden':''}>
        <div class="embed-frame-wrap">
          <iframe
            id="embed-frame"
            src="${currentDetailTab==='embed'?escapeAttr(n.url):''}"
            data-src="${escapeAttr(n.url)}"
            sandbox="allow-scripts allow-popups"
            referrerpolicy="no-referrer"
            loading="lazy"
            title="${escapeAttr(n.title)}"></iframe>
        </div>
        <p class="embed-tip">原 HTML 页面已内嵌在本花园内，<strong>不离开不刷新</strong>左侧面板的状态。如内嵌异常（少数页面禁止 iframe 嵌入），请点上方 <code>↗ 新标签打开原文</code>。</p>
      </div>

      <div class="detail-panel" data-panel="summary" ${currentDetailTab!=='summary'?'hidden':''}>
        ${forward.length?`
        <div class="detail-section">
          <h3>🔗 相关笔记 · ${forward.length}</h3>
          <div class="related-list">
            ${forward.map(r=>relatedItemHTML(r,'→')).join('')}
          </div>
        </div>`:''}

        ${back.length?`
        <div class="detail-section">
          <h3>🔁 反向链接 · ${back.length}</h3>
          <div class="related-list">
            ${back.map(r=>relatedItemHTML(r,'←')).join('')}
          </div>
          <p style="margin-top:10px;font-size:12px;color:var(--text-3);line-height:1.6">被 ${back.length} 篇笔记引用过 · 这意味着这些笔记都认为「${escapeHtml(n.title)}」是不可或缺的概念</p>
        </div>`:''}

        ${!forward.length && !back.length ? `
        <div class="detail-section">
          <h3>🔗 笔记关系</h3>
          <p style="color:var(--text-3);font-size:13px;line-height:1.7">暂未打理双链接。可在 <code>garden-manifest.json</code> 给这篇笔记添加 <code>related</code> 字段，下次打理后这里会出现关联。</p>
        </div>`:''}

        <div class="detail-section">
          <h3>🌱 我的笔记 · 仅你可见</h3>
          <textarea class="notes-area" id="note-input" placeholder="私人留言 · 思考、对照、todo、举例…&#10;保存在 localStorage，不会同步到服务器。">${escapeHtml(noteText)}</textarea>
          <div class="notes-meta">
            <span id="note-status">${noteText?'已保存':'暂无笔记'}</span>
            <span>${noteText.length} 字</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function relatedItemHTML(n,direction){
  return `<div class="related-item m${n.maturity}" data-id="${escapeAttr(n.id)}">
    <span class="mat-dot"></span>
    <span class="title">${escapeHtml(n.title)}</span>
    <span style="font-size:11px;color:var(--text-3);font-family:var(--font-mono)">${escapeHtml(n.cat||'')}</span>
    <span class="arrow">${direction==='←'?'←':'→'}</span>
  </div>`;
}

// ─── Render orchestrator ───
const mainEl=document.getElementById('main');
function render(){
  try{
    renderSidebar();
    if(currentNote){
      mainEl.innerHTML=viewDetail();
      bindDetail();
      toggleViewSwitcher(false);
    }else{
      let html='';
      let baseView=currentView;
      let mode='cards';
      if(baseView.includes(':')){
        [baseView,mode]=baseView.split(':');
      }
      if(baseView==='garden-home'||baseView==='home'){
        html=viewGardenHome();mode='cards';
      }else if(baseView==='cat'){
        html=viewCat();mode='cards';
      }else if(baseView==='all'){
        html=viewAll();mode='cards';
      }else if(baseView==='tended'){
        html=viewTended();mode='cards';
      }else if(baseView==='seedlings'){
        html=viewSeedlings();mode='cards';
      }else if(baseView==='favs'){
        html=viewFavs();mode='cards';
      }else if(baseView==='recent'){
        html=viewRecent();mode='cards';
      }else if(baseView==='my-notes'){
        html=viewMyNotes();mode='cards';
      }else{
        html=viewGardenHome();baseView='garden-home';mode='cards';
      }
      if(mode==='graph')html=viewGraph();
      else if(mode==='timeline')html=viewTimeline();
      mainEl.innerHTML=html;
      toggleViewSwitcher(true,mode);
      bindList();
      if(mode==='graph')renderGraph();
    }
    // active sidebar
    document.querySelectorAll('#sidebar .nav-item').forEach(el=>{
      el.classList.remove('active');
      if(currentNote)return;
      if(el.dataset.view===currentView)el.classList.add('active');
      if(el.dataset.cat===currentCat&&currentView==='cat')el.classList.add('active');
    });
  }catch(err){
    console.error('render error',err);
    mainEl.innerHTML=`<div class="empty"><div class="icon">⚠️</div><h3>页面渲染出错</h3><p>${escapeHtml(err.message)}</p><button class="btn" onclick="localStorage.removeItem('${STORE_KEY}');location.reload()" style="margin-top:12px">清除本地状态并重载</button></div>`;
  }
}

// ─── Bindings ───
function bindList(){
  document.querySelectorAll('.card[data-id]').forEach(el=>{
    el.onclick=()=>openNote(el.dataset.id);
  });
  document.querySelectorAll('.timeline-item[data-id]').forEach(el=>{
    el.onclick=()=>openNote(el.dataset.id);
  });
  document.querySelectorAll('.filter-pills .pill[data-tag]').forEach(el=>{
    el.onclick=()=>{
      const t=el.dataset.tag;
      if(activeTags.has(t))activeTags.delete(t);else activeTags.add(t);
      render();
    };
  });
  const clear=document.getElementById('clear-tags');
  if(clear)clear.onclick=()=>{activeTags.clear();render()};
  document.querySelectorAll('#main .related-item[data-id]').forEach(el=>{
    el.onclick=(e)=>{
      if(e.target.closest('a'))return;
      openNote(el.dataset.id);
    };
  });
}

function bindDetail(){
  document.getElementById('back-btn').onclick=()=>{
    currentNote=null;
    if(detailStack.length){
      const prev=detailStack.pop();
      if(prev.includes(':')){
        [currentView,currentCat]=prev.split(':');
        if(currentCat===undefined||currentCat==='undefined')currentCat=null;
      }else{
        currentView=prev;currentCat=null;
      }
    }else{
      currentView='garden-home';
    }
    render();
  };
  // ── Tab 切换（🌐 原文 / 📖 摘要）──
  document.querySelectorAll('.detail-tabs .tab').forEach(btn=>{
    btn.onclick=()=>{
      const tab=btn.dataset.tab;
      currentDetailTab=tab;
      try{localStorage.setItem('mycelium:detailTab',tab)}catch{}
      document.querySelectorAll('.detail-tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
      document.querySelectorAll('.detail-panel').forEach(p=>{
        const on=p.dataset.panel===tab;
        if(on){p.removeAttribute('hidden')}else{p.setAttribute('hidden','')}
      });
      // 切到 embed 时懒加载 iframe src（首次从 summary 进入时才设）
      if(tab==='embed'){
        const ifr=document.getElementById('embed-frame');
        if(ifr && ifr.dataset.src && !ifr.src){
          ifr.src=ifr.dataset.src;
        }
      }
    };
  });
  const fav=document.getElementById('fav-btn');
  if(fav)fav.onclick=()=>{
    const id=currentNote.id;
    if(state.favourites.has(id)){
      state.favourites.delete(id);toast('已取消收藏');
    }else{
      state.favourites.add(id);toast('已收藏 ⭐');
    }
    saveState();render();
  };
  const stb=document.getElementById('stumble-btn');
  if(stb)stb.onclick=()=>stumble();
  const inp=document.getElementById('note-input');
  if(inp){
    let timer;
    inp.oninput=()=>{
      clearTimeout(timer);
      document.getElementById('note-status').textContent='保存中…';
      timer=setTimeout(()=>{
        const v=inp.value;
        if(v.trim())state.notes[currentNote.id]=v;
        else delete state.notes[currentNote.id];
        saveState();
        document.getElementById('note-status').textContent=v.trim()?'已保存':'暂无笔记';
        document.querySelector('.notes-meta span:last-child').textContent=v.length+' 字';
        toast('已保存 ✓');
      },400);
    };
  }
  document.querySelectorAll('.related-item').forEach(el=>{
    el.onclick=()=>openNote(el.dataset.id);
  });
  document.querySelectorAll('#main .chip[data-tag]').forEach(el=>{
    el.onclick=()=>{
      activeTags=new Set([el.dataset.tag]);
      currentView='all';
      localStorage.setItem(VIEW_KEY,currentView);
      currentNote=null;
      render();
    };
  });
}

// ─── Graph render (D3) ───
function renderGraph(){
  const wrap=document.getElementById('graph-wrap');
  if(!wrap)return;
  const svg=d3.select('#graph-svg');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  svg.attr('viewBox',`0 0 ${W} ${H}`);

  const list=filteredNotes().filter(n=>n.maturity>0||(n.related||[]).length>0);
  const nodes=list.map(n=>({
    id:n.id,
    title:n.title,
    cat:n.cat||'',
    m:n.maturity
  }));
  const links=[];
  list.forEach(n=>(n.related||[]).forEach(r=>{
    if(BY_ID.has(r))links.push({source:n.id,target:r});
  }));

  const colorScale=(m)=>{
    const c={0:'#9aa49d',1:'#c8dfcc',2:'#a0c8a8',3:'#6fac7c',4:'#3f8d54',5:'#265d3e'};
    return c[m]||c[0];
  };
  const radiusScale=(m)=>4+Math.max(2,m*2.5);

  svg.selectAll('*').remove();
  // arrow marker
  const defs=svg.append('defs');
  defs.append('marker')
    .attr('id','arrow').attr('viewBox','0 -5 10 10')
    .attr('refX',18).attr('refY',0)
    .attr('markerWidth',6).attr('markerHeight',6)
    .attr('orient','auto')
    .append('path')
    .attr('d','M0,-5L10,0L0,5').attr('fill','#9aa49d').attr('opacity',.6);

  const g=svg.append('g');
  const linkG=g.append('g').attr('stroke','#9aa49d').attr('stroke-opacity',.4).attr('stroke-width',1).selectAll('line').data(links).enter().append('line').attr('marker-end','url(#arrow)');
  const nodeG=g.append('g').selectAll('g').data(nodes).enter().append('g').attr('class','graph-handle');
  nodeG.append('circle').attr('r',d=>radiusScale(d.m)).attr('fill',d=>colorScale(d.m)).attr('stroke','#fff').attr('stroke-width',2).style('cursor','pointer');
  nodeG.append('text').text(d=>d.title).attr('font-size',11).attr('fill','currentColor').attr('dx',d=>radiusScale(d.m)+4).attr('dy',4).style('pointer-events','none').style('user-select','none');

  nodeG.on('click',(e,d)=>openNote(d.id)).on('mouseover',function(e,d){
    d3.select(this).select('circle').attr('stroke','#d97706').attr('stroke-width',3);
    linkG.attr('stroke-opacity',l=>l.source.id===d.id||l.target.id===d.id?.8:.05);
  }).on('mouseout',function(){
    d3.select(this).select('circle').attr('stroke','#fff').attr('stroke-width',2);
    linkG.attr('stroke-opacity',.4);
  });

  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(90))
    .force('charge',d3.forceManyBody().strength(-180))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collide',d3.forceCollide().radius(d=>radiusScale(d.m)+6))
    .on('tick',()=>{
      linkG.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeG.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
  svg.call(d3.zoom().scaleExtent([.3,3]).on('zoom',(e)=>g.attr('transform',e.transform)));
}

// ─── Stumble (random walk) ───
function stumble(){
  const cared=NOTES.filter(n=>n.maturity>0);
  const pick=cared[Math.floor(Math.random()*cared.length)];
  if(pick)openNote(pick.id);
}

// ─── Command palette ───
const cmdOverlay=document.getElementById('cmd-overlay');
const cmdInput=document.getElementById('cmd-input');
const cmdResults=document.getElementById('cmd-results');
let cmdActive=0;
let cmdFiltered=[];

function openCmd(){
  cmdOverlay.classList.add('open');
  cmdInput.value='';
  cmdInput.focus();
  runCmdSearch('');
}
function closeCmd(){cmdOverlay.classList.remove('open')}
document.getElementById('open-cmd').onclick=openCmd;
cmdOverlay.onclick=(e)=>{if(e.target===cmdOverlay)closeCmd()};
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){
    e.preventDefault();openCmd();return;
  }
  if(e.key==='Escape'&&cmdOverlay.classList.contains('open')){closeCmd();return}
  if(cmdOverlay.classList.contains('open')){
    if(e.key==='ArrowDown'){e.preventDefault();cmdActive=Math.min(cmdActive+1,cmdFiltered.length-1);renderCmd()}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdActive=Math.max(cmdActive-1,0);renderCmd()}
    else if(e.key==='Enter'){
      e.preventDefault();
      const it=cmdFiltered[cmdActive];
      if(it){closeCmd();openNote(it.id)}
    }
  }
});
cmdInput.oninput=()=>runCmdSearch(cmdInput.value);

function runCmdSearch(q){
  const tagMatch=q.match(/^tag:(.+)$/i);
  const catMatch=q.match(/^cat:(.+)$/i);
  if(tagMatch){
    const t=tagMatch[1].trim().toLowerCase();
    cmdFiltered=NOTES.filter(n=>(n.tags||[]).some(x=>x.toLowerCase().includes(t)));
  }else if(catMatch){
    const c=catMatch[1].trim().toLowerCase();
    cmdFiltered=NOTES.filter(n=>(n.cat||'').toLowerCase().includes(c));
  }else{
    q=q.trim().toLowerCase();
    if(!q){cmdFiltered=NOTES.slice().sort((a,b)=>(b.tended||b.updated).localeCompare(a.tended||a.updated)).slice(0,8)}
    else{
      cmdFiltered=NOTES.filter(n=>{
        const hay=(n.title+' '+n.desc+' '+(n.tags||[]).join(' ')).toLowerCase();
        return hay.includes(q);
      }).slice(0,40);
    }
  }
  cmdActive=0;
  renderCmd();
}

function renderCmd(){
  if(!cmdFiltered.length){
    cmdResults.innerHTML='<div class="cmd-empty">没有匹配的笔记 · 输入 tag: 或 cat: 试试</div>';
    return;
  }
  cmdResults.innerHTML=cmdFiltered.map((n,i)=>`
    <div class="cmd-item ${i===cmdActive?'active':''}" data-id="${escapeAttr(n.id)}">
      <span class="mat-dot" style="background:${({0:'#9aa49d',1:'#c8dfcc',2:'#a0c8a8',3:'#6fac7c',4:'#3f8d54',5:'#265d3e'})[n.maturity]||'#9aa49d'}"></span>
      <span class="title">${escapeHtml(n.title)}</span>
      <span class="cat">${escapeHtml(n.cat||'')}</span>
    </div>
  `).join('');
  cmdResults.querySelectorAll('.cmd-item').forEach(el=>{
    el.onclick=()=>{closeCmd();openNote(el.dataset.id)};
    el.onmouseover=()=>{cmdActive=[...el.parentElement.children].indexOf(el);renderCmd()};
  });
}

// ─── Theme button ───
document.getElementById('btn-theme').onclick=()=>{
  theme=theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=theme;
  localStorage.setItem(THEME_KEY,theme);
  toast(theme==='dark'?'🌙 暗色模式':'☀️ 浅色模式');
};

// ─── Random button ───
document.getElementById('btn-random').onclick=stumble;

// ─── Boot ───
// migrate old 'graph' or 'timeline' as suffix-less views
if(currentView.endsWith(':graph')||currentView.endsWith(':timeline')){
  const [v,m]=currentView.split(':');
  currentView=v;
  localStorage.setItem(VIEW_KEY,currentView);
}
render();
})();
</script>
